<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IP Requests Web Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="header">
    <h1>IP Requests Web Map</h1>
    <div class="meta">Loaded: <span id="count-shown">0</span>/<span id="count-total">0</span></div>
    <div class="spacer"></div>
    <button id="btn-fit" title="Fit to data">Fit</button>
    <button id="btn-clear" title="Clear search">Clear</button>
  </header>

  <div id="container">
    <aside id="sidebar">
      <div class="section">
        <h2>Search</h2>
        <input id="search" type="text" placeholder="Filter by IP or URL..." />
      </div>
      <div id="list"></div>
    </aside>
    <main id="map"></main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="assets/app.js"></script>
</body>
</html>
